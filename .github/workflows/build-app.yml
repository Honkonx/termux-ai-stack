name: Build APK Android

on:
  # ── Push automático → siempre debug-arm64 (más liviano) ──
  push:
    branches: [main]
    paths: ['App/**']

  # ── Manual → formulario con opciones ────────────────────
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'debug-arm64'
        type: choice
        options:
          - debug-arm64       # ~60MB  · pruebas en POCO F5
          - debug-universal   # ~154MB · cualquier dispositivo
          - release-arm64     # ~25MB  · distribución final (requiere keystore)

jobs:
  build:
    runs-on: ubuntu-latest

    # Nombre dinámico según variante elegida
    name: Build (${{ github.event.inputs.build_type || 'debug-arm64' }})

    steps:

      # ── 1. Resolver variante ──────────────────────────────
      # Si es push automático → debug-arm64
      # Si es manual → lo que eligió el usuario
      - name: Resolver variante de build
        id: vars
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug-arm64' }}"
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

          case "$BUILD_TYPE" in
            debug-arm64)
              echo "gradle_task=assembleDebug"    >> $GITHUB_OUTPUT
              echo "abi_filter=arm64-v8a"         >> $GITHUB_OUTPUT
              echo "is_release=false"             >> $GITHUB_OUTPUT
              echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
              echo "artifact_name=apk-debug-arm64" >> $GITHUB_OUTPUT
              ;;
            debug-universal)
              echo "gradle_task=assembleDebug"    >> $GITHUB_OUTPUT
              echo "abi_filter="                  >> $GITHUB_OUTPUT
              echo "is_release=false"             >> $GITHUB_OUTPUT
              echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
              echo "artifact_name=apk-debug-universal" >> $GITHUB_OUTPUT
              ;;
            release-arm64)
              echo "gradle_task=assembleRelease"  >> $GITHUB_OUTPUT
              echo "abi_filter=arm64-v8a"         >> $GITHUB_OUTPUT
              echo "is_release=true"              >> $GITHUB_OUTPUT
              echo "apk_path=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
              echo "artifact_name=apk-release-arm64" >> $GITHUB_OUTPUT
              ;;
          esac

          echo "Variante seleccionada: $BUILD_TYPE"

      # ── 2. Checkout ───────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 3. Node.js 20 ────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Java 17 ───────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Dependencias ───────────────────────────────────
      - name: Instalar dependencias npm
        working-directory: App
        run: npm install

      - name: Instalar Expo CLI
        run: npm install -g @expo/cli@latest

      # ── 6. metro.config.js ───────────────────────────────
      - name: Crear metro.config.js
        working-directory: App
        run: |
          if [ ! -f metro.config.js ]; then
            echo "const { getDefaultConfig } = require('expo/metro-config');" > metro.config.js
            echo "module.exports = getDefaultConfig(__dirname);" >> metro.config.js
            echo "[OK] metro.config.js creado"
          else
            echo "[OK] metro.config.js ya existe"
          fi

      # ── 7. index.js ──────────────────────────────────────
      - name: Verificar index.js
        working-directory: App
        run: |
          if [ ! -f index.js ]; then
            echo "import 'expo/AppEntry';" > index.js
            echo "[OK] index.js creado"
          else
            echo "[OK] index.js ya existe"
          fi

      # ── 8. Expo prebuild ─────────────────────────────────
      - name: Expo prebuild
        working-directory: App
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      # ── 9. ABI filter (solo para ARM64) ──────────────────
      # Inyecta abiFilters en build.gradle para reducir tamaño
      - name: Aplicar ABI filter
        working-directory: App/android
        run: |
          ABI="${{ steps.vars.outputs.abi_filter }}"
          if [ -n "$ABI" ]; then
            sed -i '/defaultConfig {/a\            ndk { abiFilters "'"$ABI"'" }' app/build.gradle
            echo "[OK] ABI filter aplicado: $ABI"
          else
            echo "[OK] Universal build - sin ABI filter"
          fi

      # ── 10. local.properties ────────────────────────────
      - name: Configurar local.properties
        working-directory: App/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ── 11. Permisos gradlew ─────────────────────────────
      - name: Permisos gradlew
        working-directory: App/android
        run: chmod +x gradlew

      # ── 12. Bundle JS ─────────────────────────────────────
      # CRÍTICO: sin esto el APK abre con pantalla roja
      - name: Crear carpeta assets
        working-directory: App
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JS
        working-directory: App
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          SIZE=$(du -sh android/app/src/main/assets/index.android.bundle | cut -f1)
          echo "[OK] Bundle generado: $SIZE"

      # ── 13. Keystore para release (si aplica) ────────────
      - name: Configurar keystore (solo release)
        if: steps.vars.outputs.is_release == 'true'
        working-directory: App/android
        run: |
          # Para habilitar release firmado:
          # 1. Genera keystore: keytool -genkey -v -keystore release.keystore -alias app -keyalg RSA -keysize 2048 -validity 10000
          # 2. Convierte a base64: base64 -w 0 release.keystore
          # 3. Agrega en GitHub → Settings → Secrets:
          #    KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            cat >> gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "[OK] Keystore configurado"
          else
            echo "[AVISO] Sin keystore - el APK release sera unsigned"
          fi

      # ── 14. Compilar ─────────────────────────────────────
      - name: Build APK
        working-directory: App/android
        run: |
          ./gradlew ${{ steps.vars.outputs.gradle_task }} \
            -x createBundleReleaseJsAndAssets \
            --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      # ── 15. Verificar y mostrar tamaño ───────────────────
      - name: Verificar APK
        working-directory: App/android
        run: |
          APK="${{ steps.vars.outputs.apk_path }}"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "[OK] APK generado: $APK"
            echo "[OK] Tamaño: $SIZE"
          else
            echo "[ERROR] APK no encontrado en: $APK"
            find app/build/outputs/ -name "*.apk" 2>/dev/null || echo "Sin APKs"
            exit 1
          fi

      # ── 16. Subir como Artifact ──────────────────────────
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: App/android/${{ steps.vars.outputs.apk_path }}
          retention-days: 7
