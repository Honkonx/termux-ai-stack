name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['App/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Sin cache — package-lock.json no está en el repo

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias
        working-directory: App
        run: npm install

      - name: Instalar Expo CLI y React Native CLI
        run: npm install -g @expo/cli@latest react-native@0.73.6

      - name: Crear metro.config.js
        working-directory: App
        run: |
          if [ ! -f metro.config.js ]; then
            echo "const { getDefaultConfig } = require('expo/metro-config');" > metro.config.js
            echo "module.exports = getDefaultConfig(__dirname);" >> metro.config.js
            echo "[OK] metro.config.js creado"
          else
            echo "[OK] metro.config.js ya existe"
          fi

      - name: Verificar index.js
        working-directory: App
        run: |
          if [ ! -f index.js ]; then
            echo "import 'expo/AppEntry';" > index.js
            echo "[OK] index.js creado"
          else
            echo "[OK] index.js ya existe - contenido:"
            cat index.js
          fi

      - name: Expo prebuild
        working-directory: App
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Configurar local.properties
        working-directory: App/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "[OK] SDK -> $ANDROID_SDK_ROOT"

      - name: Permisos gradlew
        working-directory: App/android
        run: chmod +x gradlew

      # ── PASO CRÍTICO: bundle JS dentro del APK ────────────
      # Sin esto el APK abre con pantalla roja "Unable to load script"
      - name: Crear carpeta assets
        working-directory: App
        run: mkdir -p android/app/src/main/assets

      - name: Bundle JS
        working-directory: App
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          echo "[OK] Bundle generado"
          ls -lh android/app/src/main/assets/

      - name: Verificar bundle existe
        working-directory: App
        run: |
          if [ ! -f android/app/src/main/assets/index.android.bundle ]; then
            echo "[ERROR] Bundle no generado - el APK tendrá pantalla roja"
            exit 1
          fi
          SIZE=$(du -sh android/app/src/main/assets/index.android.bundle | cut -f1)
          echo "[OK] index.android.bundle presente ($SIZE)"

      - name: Build APK debug
        working-directory: App/android
        run: |
          ./gradlew assembleDebug \
            -x createBundleReleaseJsAndAssets \
            --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Verificar APK
        run: |
          APK="App/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "[OK] APK generado: $(du -sh $APK | cut -f1)"
          else
            find App/android/app/build/outputs/ -name "*.apk" 2>/dev/null || echo "Sin APK"
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-ai-stack-debug
          path: App/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
